name: Shulker
icon: assets/icon.png
processes:
  Go Format:
    command: gofmt -w .
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Go Test:
    command: test -z "$(gofmt -l .)" && go vet ./... && go test ./... -count=1 -v
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Site Dev:
    command: npm run dev -- --host --open
    working_dir: site
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Schema Check:
    command: for f in testdata/minimal.json testdata/two-target.json; do npx --yes --package ajv-cli --package ajv-formats ajv validate -s schema/v1/manifest.json -d "$f" --spec=draft2020 -c ajv-formats --strict=false || exit 1; done && npx --yes --package ajv-cli --package ajv-formats ajv validate -s schema/v1/lock.json -d testdata/lock.json --spec=draft2020 -c ajv-formats --strict=false
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
