name: Shulker
icon: assets/icon.png
processes:
  Go Test:
    command: test -z "$(gofmt -l .)" && go vet ./... && go test ./... -count=1 -v
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Site Dev:
    command: npm run dev -- --host --open
    working_dir: site
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
